schema: 1

project:
  name: MarinOS
  repo: marin-os
  type: platform
  owner: County of Marin
  audience: staff
  status: beta

platform:
  shell: 1.9.0
  template: manual

deployment:
  target: github-pages
  url: https://marincountygov.github.io/marin-os/

ai:
  used: false

services:
  pagespeed-insights:
    name: Google PageSpeed Insights API
    purpose: Tests each app's accessibility every week
    runs: build
    visitor-data: false
  github-api:
    name: GitHub API
    purpose: Collects languages, dependency lists, and bundled-component facts for the Tech page
    runs: build
    visitor-data: false
