name: Check catalog sync

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-catalog-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: node scripts/check-catalog-sync.js
      - run: node scripts/check-projects.js
      - run: node scripts/check-lighthouse.js
