name: Check catalog sync

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-catalog-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/check-catalog-sync.js
